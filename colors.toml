# BMW M-inspired theme for Omarchy. Originally generated by Aether for Omarchy v4.
#
# Retuned 2026-08-15. The generated palette had three collapses:
#
#   1. Backgrounds. darker/dark/background were all near-black
#      (#000002/#000002/#000003, luminance ~0.0008) with no tonal separation,
#      then jumped to 0.102 for lighter_background. Replaced with a monotonic
#      blue-grey ramp; background now luminance 0.071, in line with the darkest
#      stock Omarchy themes rather than 150x below the median.
#
#   2. Selection. selection was byte-identical to foreground (#c7efe3), so
#      selected text rendered at 1.06:1 contrast -- effectively invisible.
#      Now BMW M dark blue (#16588e); text-on-selection 6.32:1.
#
#   3. Warm end. red, orange, yellow and brown all sat at ~345-348deg, meaning
#      ANSI color1 (errors) and color3 (warnings) were 3deg apart and visually
#      identical. Now separated by 44deg. red is BMW M red's hue (356) and
#      saturation (80) exactly, with lightness lifted 52->60 so it clears
#      WCAG AA against the new background.
#
# The magenta family is deliberately left pink -- that is where the theme's
# character lives. foreground and the blues/greens are untouched.
mode = "dark"

accent = "#6694ff"
selection = "#16588e"
muted = "#5f6167"

background = "#101219"
dark_background = "#0c0e14"
darker_background = "#090b10"
lighter_background = "#1a1d26"

foreground = "#c7efe3"
dark_foreground = "#95b3aa"
light_foreground = "#cff1e7"
bright_foreground = "#d5f3ea"

red = "#eb4752"
yellow = "#ffc857"
orange = "#ff8c42"
green = "#00cc83"
cyan = "#00b1ff"
blue = "#6694ff"
magenta = "#d571ef"
brown = "#a86648"

bright_red = "#ff6070"
bright_yellow = "#ffe08a"
bright_green = "#1ef392"
bright_cyan = "#39d6ff"
bright_blue = "#88b5ff"
bright_magenta = "#ff8cff"
